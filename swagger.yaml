      summary: Category update
      description: Updating the category. You can update as many fields as you want. When updating an image, the old one is deleted.
      security:
      - bearerAuth: []
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: category 
          in: path
          description: Id of the category to update
          required: true
          type: integer
          format: int64
        - name: title
          in: formData
          description: Title of the category. It must be a unique value in the table
          required: false
          type: string
        - name: file
          in: formData
          description: Image category
          required: false
          type: file
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/Category'
        '400':
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Category not found
          schema:
            $ref: '#/definitions/ApiResponse'

  /dishes:
