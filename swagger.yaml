            - asc
            - desc
        - name: search
          in: query
          description: The column to search for. Must be present in the table
          required: false
          type: string
          enum:
            - compound
            - title
        - name: search_order
          in: query
          description: The value for the search. Must be in the selected column
          required: false
          type: string
        - name: page
          in: query
          description: Selecting the current page
          required: true
          type: integer
        - name: perPage
          in: query
          description: Select the number of entries per page
          required: true
          type: integer
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/DishPaginate'
        '400':
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Category not found
          schema:
            $ref: '#/definitions/ApiResponse'
    post:
      tags:
        - dishes
      summary: Create a dish 
      description: Create a dish. All fields are required
      security:
      - bearerAuth: []
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: title
          description: Title of the dish. It must be a unique value in the table
          in: formData
          required: true
          type: string
        - name: file
          in: formData
          description: Image dish
          required: true
          type: file
        - name: compound
          in: formData
          description: Сomposition of the dish
          required: true
          type: string
        - name: calories
          in: formData
          description: Amount of calories
          required: true
          type: number
        - name: price
          in: formData
          description: The price of the dish
          required: true
          type: number
        - name: category_id
          in: formData
          description: The dish category id
          required: true
          type: integer
          format: int64
      responses:
        '201':
          description: Successful operation
          schema:
            $ref: '#/definitions/Dish'
        '400':
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Dish not found
          schema:
            $ref: '#/definitions/ApiResponse'
  
  /dishes/{id}:
    get:
      tags:
