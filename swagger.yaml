          required: true
          type: integer
          format: int64
        - name: title
          in: formData
          description: Title of the dish. It must be a unique value in the table
          required: false
          type: string
        - name: file
          in: formData
          description: Image dish
          required: false
          type: file
        - name: compound
          in: formData
          description: Сomposition of the dish
          required: false
          type: string
        - name: calories
          in: formData
