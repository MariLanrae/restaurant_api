swagger: '2.0'
info:
  description: "This is study restaurant project"
  version: 1.0.0
  title: Swagger Restaurant
tags:
  - name: categories
    description: Сombines dishes into groups. Classifies dishes
  - name: dishes
    description: Information about dishes. One dish can belong to only one category.
  - name: roles
    description: List of all possible roles for users.
  - name: users
    description: Full information about users.
  - name: orders
    description: It contains full information about the order - dishes, their quantity, cost, date of opening, closing and status.
  - name: login
    description: Login functionality
  - name: logout
    description: Logout functionality

securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: 'Enter your token in the "Bearer {token}" format'
schemes:
  - http
paths:
  /categories:
    get:
      tags:
        - categories
      summary: View all. Sorting and searching
      description: View all categories. Sorting and searching by title 
      security:
      - bearerAuth: []
      parameters:
        - name: sort 
          in: query
          description: Сolumn header for sorting. Must be in the table
          required: false
          type: string
          enum:
            - title
        - name: sort_order
          in: query
          description: Choosing the sorting direction - asc or desc
          required: false
          type: string
          enum:
            - asc
            - desc
        - name: search
          in: query
          description: The column to search for. Must be present in the table
          required: false
          type: string
          enum:
            - title
        - name: search_order
          in: query
          description: The value for the search. Must be in the selected column
          required: false
          type: string
        - name: page
          in: query
          description: Selecting the current page
          required: true
          type: integer
        - name: perPage
          in: query
          description: Select the number of entries per page
          required: true
          type: integer
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/CategoryPaginate'
        '400':
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Category not found
          schema:
            $ref: '#/definitions/ApiResponse'
    post:
      tags:
        - categories
      summary: Create a category 
      description: Create a category. All fields are required
      security:
      - bearerAuth: []
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: title
          description: Title of the category. It must be a unique value in the table
          in: formData
          required: true
          type: string
        - name: file
          description: Image category
          in: formData
          required: true
          type: file
      responses:
        '201':
          description: Successful operation
          schema:
            $ref: '#/definitions/Category'
        '400':
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Category not found
          schema:
            $ref: '#/definitions/ApiResponse'

  /categories/{category}:
    get:
      tags:
        - categories
      summary: View of one category
      description: View of one category by id
      security:
      - bearerAuth: []
      parameters:
        - name: category 
          in: path
          description: Id of the category to search for
          required: true
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/Category'
        '400':
          description: Invalid ID supplied
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Category not found
          schema:
            $ref: '#/definitions/ApiResponse'
    delete:
      tags:
        - categories
