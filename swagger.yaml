          name: body
          required: true
          schema:
            type: object
            properties:
              number:
                description: The order number. The minimum length is 3 digits.
                type: string
              user_id:
                description: ID of the user who created the order
                type: integer
              status:
                description: status order
                type: string
                enum:
                  - closed
                  - open
                  - canceled
                  - paid
              dishes:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                      description: Title of the dish
                    quantity:
                      type: integer
                      description: Number of servings
                  required:
                    - title
                    - quantity
